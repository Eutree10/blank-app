<?xml version="1.0" encoding="UTF-8"?>
<!-- Questline brand emblem: a stopwatch / target dial in gold over black.
     This is the design source. The shipped raster (logo.png / launcher_icon.png)
     is generated from the same geometry by scripts/gen_assets.py. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <g fill="none" stroke="#F4B400" stroke-linecap="round">
    <!-- crown / start button -->
    <rect x="41.3" y="2" width="13.4" height="11" rx="3" fill="#F4B400" stroke="none"/>
    <line x1="73" y1="15" x2="78" y2="10" stroke-width="5"/>
    <!-- outer ring -->
    <circle cx="48" cy="50" r="38" stroke-width="7"/>
    <!-- major ticks -->
    <g stroke-width="5">
      <line x1="48" y1="18" x2="48" y2="26"/>
      <line x1="80" y1="50" x2="72" y2="50"/>
      <line x1="48" y1="82" x2="48" y2="74"/>
      <line x1="16" y1="50" x2="24" y2="50"/>
    </g>
    <!-- minor ticks -->
    <g stroke-width="3" stroke="#B48400">
      <line x1="64" y1="22.3" x2="60.6" y2="28.2"/>
      <line x1="75.7" y1="34" x2="69.8" y2="37.4"/>
      <line x1="75.7" y1="66" x2="69.8" y2="62.6"/>
      <line x1="64" y1="77.7" x2="60.6" y2="71.8"/>
      <line x1="32" y1="77.7" x2="35.4" y2="71.8"/>
      <line x1="20.3" y1="66" x2="26.2" y2="62.6"/>
      <line x1="20.3" y1="34" x2="26.2" y2="37.4"/>
      <line x1="32" y1="22.3" x2="35.4" y2="28.2"/>
    </g>
    <!-- countdown hand (lime) + base hand (gold) -->
    <line x1="48" y1="50" x2="65" y2="33" stroke="#A3E635" stroke-width="6"/>
    <line x1="48" y1="50" x2="48" y2="62" stroke-width="5"/>
  </g>
  <circle cx="48" cy="50" r="5" fill="#F4B400"/>
</svg>

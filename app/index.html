<title>Tino</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF7F1">
<style>
:root{
  --bg:#FBF7F1; --surface:#FFFFFF; --surface-2:#F4EEE4; --border:#ECE3D6; --border-2:#E4D9C8;
  --text:#1B1712; --muted:#8B8173; --faint:#B6AC9E;
  --accent:#FF5A1F; --accent-ink:#E24A12; --accent-soft:#FFEDE3;
  --up:#1E9E5A; --down:#D8402F;
  --shadow:0 1px 2px rgba(27,23,18,.04), 0 8px 24px rgba(27,23,18,.06);
  --r:22px; --r-sm:16px;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--sans);background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;line-height:1.4;overflow:hidden;
}
button{font-family:inherit}
.app{
  position:relative;max-width:440px;margin:0 auto;height:100dvh;height:100vh;
  background:var(--bg);overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 0 60px rgba(27,23,18,.08);
}
.money{font-family:var(--mono);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.label-xs{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* scroll area */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(120px + var(--safe-b));-webkit-overflow-scrolling:touch;display:none}
.screen.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.head{display:flex;align-items:flex-start;justify-content:space-between;padding:6px 2px 16px}
.h-greet{font-size:15px;color:var(--muted);font-weight:600}
.h-title{font-size:27px;font-weight:820;letter-spacing:-.03em;line-height:1.08}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;background:linear-gradient(140deg,#FFD9B0,#FF8A4C);color:#fff;font-weight:800;display:grid;place-items:center;font-size:16px;box-shadow:var(--shadow)}
.iconbtn{width:42px;height:42px;border-radius:13px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--text);box-shadow:var(--shadow)}
.iconbtn svg{width:21px;height:21px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.stack>*+*{margin-top:14px}

.balance-hero{background:linear-gradient(160deg,#211B14 0%,#15110C 100%);color:#fff;border-radius:26px;padding:22px;position:relative;overflow:hidden;box-shadow:0 18px 40px -16px rgba(27,23,18,.5)}
.balance-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,31,.55),transparent 70%)}
.balance-hero .label-xs{color:rgba(255,255,255,.6)}
.balance-hero .big{font-size:36px;margin-top:8px}
.balance-hero .sub{color:rgba(255,255,255,.72);font-size:13.5px;margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip-up{background:rgba(63,185,80,.18);color:#7CE0A0;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}
.chip-down{background:rgba(216,64,47,.2);color:#FF9E92;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}

.progress{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FF7A3D,#FF4D14);transition:width .5s ease}
.progress.warn>i{background:linear-gradient(90deg,#FFB020,#FF7A1C)}
.progress.over>i{background:var(--down)}
.progress.mini{height:8px}

.blk-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px;margin:18px 0 10px}
.blk-head h3{font-size:16px;font-weight:800;letter-spacing:-.01em}
.blk-head a{color:var(--accent-ink);font-size:13px;font-weight:700;background:none;border:0}

.cat-ic{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.cat-ic svg{width:21px;height:21px}
.cat-ic.accent{background:var(--accent-soft);border-color:#FFD9C6;color:var(--accent-ink)}
.list-row{display:flex;align-items:center;gap:13px;padding:11px 2px}
.list-row+.list-row{border-top:1px solid var(--border)}
.cat-line{display:flex;align-items:center;gap:13px}
.tap{transition:transform .12s ease}
.tap:active{transform:scale(.985);opacity:.85}
.grow{flex:1;min-width:0}
.tt{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts{color:var(--muted);font-size:12.5px;font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-family:var(--mono);font-weight:700;font-size:15px;white-space:nowrap}
.amt.pos{color:var(--up)}
.tx-ic{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px solid var(--border-2);background:var(--surface);color:var(--text)}
.tx-ic svg{width:22px;height:22px}
.stat-card{background:var(--surface-2);border-radius:18px;padding:16px 17px}
.stat-card .k{font-size:14px;font-weight:600;color:var(--muted)}
.stat-card .v{font-size:23px;margin-top:7px}
.stat-card .s{font-size:12.5px;color:var(--muted);margin-top:5px;font-weight:500}

.insight{display:flex;gap:13px;align-items:flex-start;padding:16px;background:var(--accent-soft);border:1px solid #FFD9C6;border-radius:20px}
.insight .spark{width:34px;height:34px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.insight .spark svg{width:20px;height:20px}
.insight p{font-size:13.5px;font-weight:600;line-height:1.45}
.insight b{color:var(--accent-ink)}

.empty{text-align:center;color:var(--muted);padding:34px 18px;font-size:14px;font-weight:500}
.empty .big{font-size:34px;margin-bottom:10px}

.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:2px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;font-weight:700;font-size:13px;color:var(--muted);padding:9px;border-radius:11px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-f{white-space:nowrap;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--muted)}
.chip-f.on{background:var(--text);color:#fff;border-color:var(--text)}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:11px 14px;box-shadow:var(--shadow);margin-bottom:12px}
.search svg{width:19px;height:19px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;font-family:inherit;font-size:14.5px;font-weight:500;color:var(--text);width:100%;outline:none}

/* bottom nav */
.tabbar{position:absolute;left:12px;right:12px;bottom:calc(12px + var(--safe-b));height:62px;z-index:50;background:rgba(27,23,18,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:26px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 16px 34px -10px rgba(27,23,18,.55)}
.tabbar .grp{display:flex;gap:14px}
.tabbar .t{display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,.5);font-size:9.5px;font-weight:700;background:none;border:0;min-width:44px}
.tabbar .t.on{color:#fff}
.tabbar .t svg{width:22px;height:22px}
.tab-fab{width:56px;height:56px;border-radius:20px;background:linear-gradient(150deg,#FF7A3D,#FF4D14);display:grid;place-items:center;color:#fff;margin-top:-24px;flex:none;border:0;box-shadow:0 12px 24px -6px rgba(255,77,20,.7), 0 0 0 5px rgba(27,23,18,.94)}
.tab-fab svg{width:28px;height:28px}
.tab-fab:active{transform:scale(.94)}

/* add sheet */
.scrim{position:absolute;inset:0;background:rgba(27,23,18,.34);z-index:80;opacity:0;pointer-events:none;transition:opacity .28s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:90;background:var(--surface);border-radius:28px 28px 0 0;padding:0 18px calc(20px + var(--safe-b));box-shadow:0 -20px 50px -20px rgba(27,23,18,.4);transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);max-height:94%;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--border-2);margin:10px auto 6px}
.sheet-handle{touch-action:none;cursor:grab;padding-bottom:2px}
.sheet-handle:active{cursor:grabbing}
.sheet-handle .grab{transition:width .15s ease}
.sheet-handle:active .grab{width:52px;background:var(--faint)}
.type-toggle{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:3px;margin:6px 0 10px}
.type-toggle button{flex:1;border:0;background:transparent;font-weight:750;font-size:14px;color:var(--muted);padding:11px;border-radius:11px}
.type-toggle button.on-exp{background:var(--surface);color:var(--down);box-shadow:var(--shadow)}
.type-toggle button.on-inc{background:var(--surface);color:var(--up);box-shadow:var(--shadow)}
.amount-display{text-align:center;margin:6px 0}
.amount-display .money{font-size:46px;letter-spacing:-.03em}
.amount-display .cur{color:var(--muted)}
.amount-display .z{color:var(--faint)}
.icon-picker{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding:4px 0 2px}
.icon-picker::-webkit-scrollbar{display:none}
.ip{width:56px;flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0}
.ip .cat-ic{width:50px;height:50px}
.ip small{font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.ip.on .cat-ic{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.ip.on small{color:var(--accent-ink);font-weight:800}
.field-row{display:flex;gap:9px;margin-top:10px}
.inp{flex:1;background:var(--surface);border:1.5px solid var(--border-2);border-radius:14px;padding:13px 14px;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--text);outline:none;min-width:0}
.inp::placeholder{color:var(--faint);font-weight:500}
.selpill{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1.5px solid var(--border-2);border-radius:14px;padding:13px 14px;font-size:13.5px;font-weight:700;color:var(--text)}
.selpill svg{width:17px;height:17px;color:var(--muted)}
.recur{display:flex;align-items:center;gap:11px;margin-top:12px;padding:2px 2px}
.recur svg{width:20px;height:20px;color:var(--muted)}
.toggle{width:46px;height:27px;border-radius:999px;background:var(--border-2);position:relative;flex:none;border:0;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:var(--shadow);transition:left .2s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:22px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.keypad button{background:transparent;border:0;font-size:23px;font-weight:700;color:var(--text);padding:13px;border-radius:14px}
.keypad button:active{background:var(--surface-2)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--accent);color:#fff;border:0;border-radius:17px;padding:16px;font-weight:750;font-size:16px;letter-spacing:-.01em;box-shadow:0 10px 22px -8px rgba(255,77,20,.6);margin-top:12px}
.btn:active{transform:scale(.99)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border-2);box-shadow:var(--shadow)}
.btn:disabled{opacity:.45;box-shadow:none}

/* detail modal */
.modal{position:absolute;inset:0;z-index:95;background:var(--bg);transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(30px + var(--safe-b));display:none}
.modal.on{transform:translateX(0);display:block}
/* subscriptions */
.sub-monogram{width:46px;height:46px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border);font-family:var(--sans);font-weight:800;font-size:16px;letter-spacing:-.02em;color:var(--text)}
.sub-row{display:flex;align-items:center;gap:14px;padding:15px 2px}
.sub-row+.sub-row{border-top:1px solid var(--border)}
.sub-row .nm{font-size:16.5px;font-weight:750;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-row .meta{color:var(--muted);font-size:12.5px;font-weight:500;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-row.dim .sub-monogram,.sub-row.dim .nm{opacity:.5}
.sub-row.dim .nm{text-decoration:line-through}
.st-chip{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.st-active{color:var(--up);background:var(--up-soft)}
.st-paused{color:#9A7B10;background:#FBF1CF}
.st-cancelled{color:var(--muted);background:var(--surface-2)}
.sub-price{font-family:var(--mono);font-weight:800;font-size:16px;white-space:nowrap}
.sum-hero{font-family:var(--mono);font-weight:820;font-size:34px;letter-spacing:-.02em}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-radius:16px;overflow:hidden;margin-top:14px}
.sum-cell{background:var(--surface);padding:14px 16px}
.sum-cell .k{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sum-cell .v{font-family:var(--mono);font-weight:800;font-size:19px;margin-top:6px}
.proj-hero{font-family:var(--mono);font-weight:820;font-size:30px;letter-spacing:-.02em;color:var(--accent-ink);text-align:center}
.proj-presets{display:flex;gap:8px;margin:12px 0 4px}
.proj-presets button{flex:1;border:1.5px solid var(--border-2);background:var(--surface);border-radius:12px;padding:9px 4px;font-weight:800;font-size:13px;color:var(--muted)}
.proj-presets button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.proj-slider{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:999px;background:var(--surface-2);outline:none;margin:14px 0 6px}
.proj-slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:var(--shadow);cursor:pointer}
.proj-slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);border:4px solid #fff;cursor:pointer}
.proj-phrase{background:var(--accent-soft);border:1px solid #FFD9C6;border-radius:16px;padding:15px;font-size:14px;font-weight:600;line-height:1.5;margin-top:14px}
.proj-phrase b{color:var(--accent-ink)}
.detail-amt{font-size:40px;font-family:var(--mono);font-weight:820;letter-spacing:-.03em;text-align:center;margin:8px 0}
.kv{display:flex;align-items:center;justify-content:space-between;padding:14px 2px}
.kv+.kv{border-top:1px solid var(--border)}
.kv .k{color:var(--muted);font-size:14px;font-weight:600}
.kv .v{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}

/* bars */
.bars{display:flex;align-items:flex-end;gap:7px;height:120px;padding:6px 2px 0}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.bars .b i{width:100%;max-width:26px;border-radius:8px 8px 4px 4px;background:var(--surface-2);transition:height .5s ease}
.bars .b.on i{background:linear-gradient(180deg,#FF7A3D,#FF4D14)}
.bars .b span{font-size:10.5px;font-weight:700;color:var(--muted)}
.bars .b.on span{color:var(--text)}

.donut{width:130px;height:130px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:24px;background:var(--surface);border-radius:50%}
.donut .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:2}
.donut .ctr b{font-size:19px;font-family:var(--mono);font-weight:800}
.donut .ctr small{color:var(--muted);font-size:10.5px;font-weight:600;display:block}
.legend{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.leg{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;min-width:0}
.leg .sw{width:11px;height:11px;border-radius:4px;flex:none}
.leg .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg .lv{margin-left:auto;font-family:var(--mono);font-weight:700;flex:none}

.set-group{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.set-row{display:flex;align-items:center;gap:13px;padding:14px 15px;width:100%;background:none;border:0;text-align:left}
.set-row+.set-row{border-top:1px solid var(--border)}
.set-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.set-ic svg{width:18px;height:18px}
.set-row .tt{font-size:14.5px}
.chev{color:var(--faint)}
.chev svg{width:18px;height:18px}

.toast{position:absolute;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:700;z-index:100;opacity:0;pointer-events:none;transition:all .3s ease;box-shadow:0 10px 30px -6px rgba(27,23,18,.5);white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* onboarding */
.ob{position:absolute;inset:0;z-index:120;background:var(--bg);display:none;flex-direction:column;padding:calc(30px + env(safe-area-inset-top,0px)) 24px calc(24px + var(--safe-b));overflow-y:auto}
.ob.on{display:flex}
.ob .logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(150deg,#FF7A3D,#FF4D14);display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;box-shadow:0 8px 20px rgba(255,77,20,.35);margin-bottom:auto}
.ob h1{font-size:34px;font-weight:850;letter-spacing:-.035em;line-height:1.05}
.ob h1 em{color:var(--accent);font-style:normal}
.ob p{color:var(--muted);font-size:16px;margin-top:16px;line-height:1.55;font-weight:450}
.ob .field{margin-top:18px}
.ob label{font-size:12.5px;font-weight:700;color:var(--muted);margin-left:4px}
.ob .inp{width:100%;margin-top:7px;padding:15px 16px;font-size:16px}
.ob .foot{margin-top:24px}
.ob .steps{display:flex;gap:6px;margin-bottom:22px}
.ob .steps i{height:5px;border-radius:3px;background:var(--border-2);flex:1}
.ob .steps i.on{background:var(--accent)}
.cur-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cur-opt{border:1.5px solid var(--border-2);background:var(--surface);border-radius:14px;padding:14px;font-weight:700;font-size:14.5px;text-align:left}
.cur-opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.cur-list{margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:264px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cur-list::-webkit-scrollbar{display:none}
.cur-item{display:flex;align-items:center;gap:12px;border:1.5px solid var(--border-2);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.cur-item.on{border-color:var(--accent);background:var(--accent-soft)}
.cur-item .sym{font-family:var(--mono);font-weight:800;font-size:15px;min-width:40px;color:var(--text)}
.cur-item.on .sym{color:var(--accent-ink)}
.cur-item .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cur-item .cd{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.cur-item.on .cd{color:var(--accent-ink)}

/* ============ RECURRING ENGINE ============ */
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function freqLabel(f){return f==='week'?'Semanal':f==='year'?'Anual':'Mensual';}
function recurText(ts,f){
  const d=new Date(ts);
  if(f==='week'){const dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];return `cada semana los ${dias[d.getDay()]}`;}
  if(f==='year'){return `cada año el ${d.getDate()} de ${MESES[d.getMonth()]}`;}
  return `cada mes el día ${d.getDate()}`;
}
// next occurrence timestamp after ts for a given frequency (month/year clamp day to month length)
function addPeriod(ts,freq){
  const d=new Date(ts);
  if(freq==='week'){d.setDate(d.getDate()+7);return d.getTime();}
  const day=d.getDate();
  if(freq==='year'){d.setDate(1);d.setFullYear(d.getFullYear()+1);}
  else{d.setDate(1);d.setMonth(d.getMonth()+1);} // default monthly
  const lastDay=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  d.setDate(Math.min(day,lastDay));
  return d.getTime();
}
// generate any occurrences that are already due (up to end of today) for every recurring series
function runRecurring(){
  const todayEnd=new Date();todayEnd.setHours(23,59,59,999);const cutoff=todayEnd.getTime();
  const series={};
  S.tx.filter(t=>t.recur&&t.seriesId&&t.freq).forEach(t=>{(series[t.seriesId]=series[t.seriesId]||[]).push(t);});
  let added=false;
  Object.entries(series).forEach(([sid,list])=>{
    if(subStatus(sid)!=='active')return; // paused/cancelled series stop generating
    list.sort((a,b)=>a.date-b.date);
    let last=list[list.length-1],guard=0;
    while(guard++<600){
      const next=addPeriod(last.date,last.freq);
      if(next>cutoff)break;
      const n={...last,id:id(),date:next};
      S.tx.push(n);added=true;last=n;
    }
  });
  if(added)save();
  return added;
}

/* ============ HELPERS ============ */
const cur=()=>CC().sym;
function fmt(n){const c=CC();return c.sym+Math.abs(n).toLocaleString(c.locale,{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmt0(n){const c=CC();return c.sym+Math.round(Math.abs(n)).toLocaleString(c.locale);}
function fmtAmount(n){const c=CC();const cents=Math.abs(n%1)>0.001;return c.sym+Math.abs(n).toLocaleString(c.locale,{minimumFractionDigits:cents?2:0,maximumFractionDigits:2});}
function sameMonth(t){const d=new Date(t),n=new Date();return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}
function prevMonth(t){const d=new Date(t),n=new Date();const p=new Date(n.getFullYear(),n.getMonth()-1,1);return d.getMonth()===p.getMonth()&&d.getFullYear()===p.getFullYear();}
function monthExp(filter){return S.tx.filter(t=>t.type==='exp'&&filter(t.date)).reduce((a,t)=>a+t.amount,0);}
function balance(){return S.tx.reduce((a,t)=>a+(t.type==='inc'?t.amount:-t.amount),0);}
function catIcHTML(id,accent){const c=CAT(id);return `<div class="cat-ic ${accent?'accent':''}">${I[c.icon]}</div>`;}
function dayLabel(t){
  const d=new Date(t),n=new Date();const strip=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=(strip(n)-strip(d))/864e5;
  if(diff===0)return'Hoy';if(diff===1)return'Ayer';
  return d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
}
function timeLabel(t){return new Date(t).toLocaleTimeString('es-ES',{hour:'numeric',minute:'2-digit'});}
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function longDate(ts){return new Date(ts).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});}
function shortDate(ts){return new Date(ts).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'});}

/* ============ SUBSCRIPTIONS ============ */
function subStatus(sid){return (S.subsMeta&&S.subsMeta[sid])||'active';}
function setSubStatus(sid,st){S.subsMeta=S.subsMeta||{};S.subsMeta[sid]=st;save();}
const FREQ_WORD={month:'por mes',year:'por año',week:'por semana'};
const FREQ_GROUP={month:'Mensuales',year:'Anuales',week:'Semanales'};
function perYear(price,freq){return price*(freq==='month'?12:freq==='year'?1:52);}
function perMonth(price,freq){return perYear(price,freq)/12;}
function initials(name){const w=(name||'?').trim().split(/\s+/);return ((w[0]?.[0]||'')+(w[1]?.[0]||'')).toUpperCase()||'?';}
// build one object per recurring series
function getSubscriptions(){
  const byS={};
  S.tx.filter(t=>t.recur&&t.seriesId&&t.freq&&t.type==='exp').forEach(t=>{(byS[t.seriesId]=byS[t.seriesId]||[]).push(t);});
  const now=Date.now();
  return Object.entries(byS).map(([sid,list])=>{
    list.sort((a,b)=>a.date-b.date);
    const anchor=list[0],latest=list[list.length-1];
    const paid=list.filter(t=>t.date<=now);
    const status=subStatus(sid);
    return {sid,name:anchor.desc||CAT(anchor.cat).name,price:anchor.price??anchor.amount,freq:anchor.freq,
      start:anchor.date,method:anchor.method,cat:anchor.cat,status,count:paid.length,
      totalPaid:paid.reduce((a,t)=>a+t.amount,0),paid,
      next:status==='active'?addPeriod(latest.date,anchor.freq):null};
  }).sort((a,b)=>(a.next||Infinity)-(b.next||Infinity));
}
function subDurationStr(sub){
  const n=Math.max(sub.count,0);
  const unit=sub.freq==='year'?['año','años']:sub.freq==='week'?['semana','semanas']:['mes','meses'];
  return `${n} ${n===1?unit[0]:unit[1]}`;
}

    ${recent.length?recent.map(t=>txRow(t)).join(''):`<div class="empty">Toca el botón <b>+</b> para agregar tu primer movimiento</div>`}
  </div>`;
}
function makeInsight(by,spent,limit){
  const entries=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  if(!entries.length)return '';
  const [tid,tv]=entries[0];
  if(limit>0&&spent>limit)return `Vas <b>${fmt0(spent-limit)}</b> por encima de tu límite. Tu mayor gasto es <b>${CAT(tid).name}</b>.`;
  const share=Math.round(tv/spent*100);
  if(share>=40)return `<b>${CAT(tid).name}</b> se lleva el <b>${share}%</b> de tu gasto este mes (${fmt0(tv)}).`;
  if(limit>0)return `Llevas <b>${fmt0(spent)}</b> gastados y <b>${fmt0(limit-spent)}</b> disponibles en tu presupuesto.`;
  return `Tu mayor gasto este mes es <b>${CAT(tid).name}</b> (${fmt0(tv)}).`;
}
function txRow(t){
  const c=CAT(t.cat);
  const sub=esc(t.desc)?c.name:(t.method?esc(t.method):c.name);
  return `<div class="list-row tap" data-tx="${t.id}">
    <div class="tx-ic">${I[c.icon]}</div>
    <div class="grow"><div class="tt">${esc(t.desc)||c.name}</div><div class="ts">${sub}</div></div>
    <div style="text-align:right;flex:none"><div class="amt ${t.type==='inc'?'pos':''}">${t.type==='inc'?'+':'-'}${fmtAmount(t.amount)}</div><div class="ts" style="margin-top:3px">${timeLabel(t.date)}</div></div>
  </div>`;
}

function renderInsights(){
  const spent=monthExp(sameMonth), prev=monthExp(prevMonth);
  const inc=S.tx.filter(t=>t.type==='inc'&&sameMonth(t.date)).reduce((a,t)=>a+t.amount,0);
  const by={};S.tx.filter(t=>t.type==='exp'&&sameMonth(t.date)).forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
  const entries=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((a,[,v])=>a+v,0)||1;
  // donut gradient
  let acc=0,stops=[];entries.forEach(([id,v],i)=>{const from=acc/total*100;acc+=v;const to=acc/total*100;stops.push(`${PIE[i%PIE.length]} ${from}% ${to}%`);});
  const donut=stops.length?`conic-gradient(${stops.join(',')})`:'var(--surface-2)';
  // 6-month bars
  const now=new Date();const months=[];
  for(let i=5;i>=0;i--){const m=new Date(now.getFullYear(),now.getMonth()-i,1);
    const v=S.tx.filter(t=>t.type==='exp'&&new Date(t.date).getMonth()===m.getMonth()&&new Date(t.date).getFullYear()===m.getFullYear()).reduce((a,t)=>a+t.amount,0);
    months.push({label:m.toLocaleDateString('es-ES',{month:'short'}),v});}

  document.getElementById('s-insights').innerHTML=`

      ${prev>0?`<div class="${dp>=0?'chip-down':'chip-up'}" style="background:var(--accent-soft);color:var(--accent-ink)">${dp>=0?'▲':'▼'} ${Math.abs(dp)}% vs mes previo</div>`:''}
    </div>
    <div class="bars">${months.map(m=>`<div class="b ${m.v===Math.max(...months.map(x=>x.v))&&m.v>0?'on':''}"><i style="height:${Math.max(4,m.v/maxM*100)}%"></i><span>${m.label}</span></div>`).join('')}</div>
  </div>

  <div class="blk-head"><h3>A dónde se fue</h3></div>
  <div class="card pad" style="display:flex;gap:16px;align-items:center">
    ${entries.length?`<div class="donut" style="background:${donut}"><div class="ctr"><b>${fmt0(spent)}</b><small>total</small></div></div>
    <div class="legend">${entries.slice(0,6).map(([id,v],i)=>`<div class="leg"><span class="sw" style="background:${PIE[i%PIE.length]}"></span><span class="nm">${CAT(id).name}</span><span class="lv">${fmt0(v)}</span></div>`).join('')}</div>`
    :`<div class="empty" style="width:100%">Sin gastos este mes todavía</div>`}
  </div>

  <div class="blk-head"><h3>Ingresos vs gastos</h3></div>
  <div class="card pad">
    <div style="display:flex;gap:14px">
      <div class="grow"><div class="label-xs">Ingresos</div><div class="money" style="color:var(--up);font-size:19px;margin-top:5px">+${fmt0(inc)}</div>
        <div class="progress mini" style="margin-top:8px"><i style="width:${inc>0?100:0}%;background:var(--up)"></i></div></div>
      <div class="grow"><div class="label-xs">Gastos</div><div class="money" style="color:var(--down);font-size:19px;margin-top:5px">-${fmt0(spent)}</div>
        <div class="progress mini" style="margin-top:8px"><i style="width:${inc>0?Math.min(100,spent/inc*100):(spent>0?100:0)}%;background:var(--down)"></i></div></div>
    </div>
    <div class="ts" style="margin-top:11px;text-align:center;white-space:normal">${inc>spent?`Ahorraste <b style="color:var(--up)">${fmt0(inc-spent)}</b> este mes`:inc>0?`Gastaste <b style="color:var(--down)">${fmt0(spent-inc)}</b> más de lo que ingresó`:'Registra un ingreso para ver tu ahorro'}</div>
  </div>

  <div class="blk-head"><h3>Gasto por categoría</h3></div>
  <div class="stack">
    ${entries.length?(()=>{const maxCat=entries[0][1]||1;return entries.map(([id,v])=>{const share=Math.round(v/total*100);const p=Math.round(v/maxCat*100);
      return `<div class="card pad tap" data-cat="${id}" style="cursor:pointer"><div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">${catIcHTML(id)}

      <div class="progress"><i style="width:${p}%"></i></div></div>`;}).join('')})()
    :`<div class="empty">Aún no hay datos para mostrar</div>`}
  </div>`;
}

let draft=null;
function openSheet(){
  draft={type:'exp',amount:'0',cat:'food',desc:'',method:METHODS[0],date:Date.now(),recur:false,freq:'month'};
  renderSheet();
  document.getElementById('scrim').classList.add('on');
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
}
function renderSheet(){
  const amtNum=parseFloat(draft.amount)||0;
  // format the live amount with the currency's thousands + decimal separators
  const loc=CC().locale;
  const decSep=(1.1).toLocaleString(loc).replace(/[0-9]/g,'')||'.';
  const hasDot=draft.amount.includes('.');
  const rawInt=hasDot?draft.amount.slice(0,draft.amount.indexOf('.')):draft.amount;
  const rawDec=hasDot?draft.amount.slice(draft.amount.indexOf('.')+1):null;
  const intp=(rawInt===''?0:Number(rawInt)).toLocaleString(loc), decp=rawDec;
  const showCats=CATS.filter(c=>draft.type==='inc'?c.id==='income':(c.id!=='income'&&c.id!=='subs'));
  if(draft.type==='inc')draft.cat='income'; else if(draft.cat==='income')draft.cat='food';
  document.getElementById('sheet').innerHTML=`
  <div class="sheet-handle"><div class="grab"></div>
  <div style="text-align:center;margin:2px 0 6px"><div class="label-xs">Nuevo movimiento</div></div></div>
  <div class="type-toggle" id="typeTog">
    <button class="${draft.type==='exp'?'on-exp':''}" data-type="exp">Gasto</button>
    <button class="${draft.type==='inc'?'on-inc':''}" data-type="inc">Ingreso</button>
  </div>
  <div class="amount-display"><span class="money"><span class="cur">${cur()}</span>${esc(intp||'0')}${decp!==null?esc(decSep+decp):`<span class="z">${decSep}00</span>`}</span></div>

  <div class="recur"><span>${I.subs}</span><span class="tt" style="font-size:14px">Cuotas / Suscripciones</span><span class="grow"></span><button class="toggle ${draft.recur?'on':''}" id="dRecur"></button></div>
  ${draft.recur?`<div class="seg" id="freqSeg" style="margin-top:10px">
    <button class="${draft.freq==='week'?'on':''}" data-freq="week">Semanal</button>
    <button class="${draft.freq==='month'?'on':''}" data-freq="month">Mensual</button>
    <button class="${draft.freq==='year'?'on':''}" data-freq="year">Anual</button>
  </div>
  <div class="ts" style="margin:8px 2px 0;white-space:normal">Se registrará solo, ${recurText(draft.date,draft.freq)}.</div>`:''}

  ${draft.recur&&draft.type==='exp'?`
  <div class="label-xs" style="margin:14px 2px 6px">Categoría</div>
  <div class="selpill" style="justify-content:flex-start;gap:10px;margin-top:2px;color:var(--accent-ink);border-color:#FFD9C6;background:var(--accent-soft)">${I.subs}<span style="font-weight:700">Suscripciones</span></div>`:`
  <div class="label-xs" style="margin:14px 2px 6px">${draft.type==='inc'?'Fuente':'Categoría'}</div>
  <div class="icon-picker" id="catPick">
    ${showCats.map(c=>`<button class="ip ${draft.cat===c.id?'on':''}" data-cat="${c.id}">${catIcHTML(c.id,draft.cat===c.id)}<small>${c.name}</small></button>`).join('')}
  </div>`}

  <div class="field-row">
    <input class="inp" id="dDesc" placeholder="Descripción (ej. ${draft.type==='inc'?'Nómina':'Chipotle'})" value="${esc(draft.desc)}" autocomplete="off">
  </div>
  <div class="field-row">
    <label class="selpill" id="dDate" style="position:relative"><span>${I.calendar} ${dayLabel(draft.date)}</span><span style="color:var(--faint)">${I.chev}</span>
      <input type="date" id="dDateInput" value="${dateInputVal(draft.date)}" max="${dateInputVal(Date.now())}" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;font-size:16px"></label>
    <button class="selpill" id="dMethod"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${I.card} ${esc(draft.method)}</span></button>
  </div>

  <div class="keypad" id="keypad">
    ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
    <button data-k=".">.</button><button data-k="0">0</button><button data-k="del">⌫</button>
  </div>
  <button class="btn" id="saveBtn" ${amtNum<=0?'disabled':''}>Guardar ${draft.type==='inc'?'ingreso':'gasto'} · ${fmt(amtNum)}</button>`;
  wireSheet();
}
function wireSheet(){
  document.getElementById('typeTog').querySelectorAll('button').forEach(b=>b.onclick=()=>{draft.type=b.dataset.type;renderSheet();});
  const cp=document.getElementById('catPick');if(cp)cp.querySelectorAll('.ip').forEach(b=>b.onclick=()=>{draft.cat=b.dataset.cat;renderSheet();});
  document.getElementById('dDesc').oninput=e=>draft.desc=e.target.value;
  document.getElementById('dRecur').onclick=()=>{draft.recur=!draft.recur;renderSheet();};
  const fs=document.getElementById('freqSeg');if(fs)fs.querySelectorAll('button').forEach(b=>b.onclick=()=>{draft.freq=b.dataset.freq;renderSheet();});
  const di=document.getElementById('dDateInput');
  if(di)di.onchange=e=>{const parts=(e.target.value||'').split('-').map(Number);if(parts[0]){const nd=new Date(parts[0],parts[1]-1,parts[2],12,0,0);draft.date=nd.getTime();renderSheet();}};
  document.getElementById('dMethod').onclick=cycleMethod;
  document.getElementById('keypad').querySelectorAll('button').forEach(b=>b.onclick=()=>key(b.dataset.k));
  document.getElementById('saveBtn').onclick=commit;
}
function dateInputVal(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function cycleMethod(){const i=METHODS.indexOf(draft.method);draft.method=METHODS[(i+1)%METHODS.length];renderSheet();}
function key(k){
  let a=draft.amount;
  if(k==='del'){a=a.length<=1?'0':a.slice(0,-1);if(a==='')a='0';}
  else if(k==='.'){if(!a.includes('.'))a=a+'.';}
  else{if(a.includes('.')&&a.split('.')[1].length>=2)return;if(a==='0')a=k;else a=a+k;}
  draft.amount=a;renderSheet();
}
function commit(){
  const amt=parseFloat(draft.amount)||0;if(amt<=0)return;
  // a recurring expense is a subscription -> auto category "Suscripciones" (no manual pick)
  const catForSave=draft.type==='inc'?'income':(draft.recur?'subs':draft.cat);
  const t={id:id(),type:draft.type,amount:Math.round(amt*100)/100,cat:catForSave,desc:draft.desc.trim(),method:draft.method,date:draft.date,recur:draft.recur};
  if(draft.recur){t.freq=draft.freq;t.seriesId=id();}
  S.tx.push(t);
  runRecurring();          // catch up any occurrences already due (e.g. back-dated series)
  save();closeSheet();renderAll();
  toast(draft.type==='inc'?'Ingreso agregado':'Gasto agregado');
}

    <div class="kv"><span class="k">Fecha</span><span class="v">${I.calendar} ${new Date(t.date).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}</span></div>
    <div class="kv"><span class="k">Hora</span><span class="v">${timeLabel(t.date)}</span></div>
    <div class="kv"><span class="k">Categoría</span><span class="v">${catIcHTML(t.cat)} ${c.name}</span></div>
    <div class="kv"><span class="k">Método</span><span class="v">${I.card} ${esc(t.method||'—')}</span></div>
    <div class="kv"><span class="k">Tipo</span><span class="v">${t.type==='inc'?'Ingreso':'Gasto'}</span></div>
    <div class="kv"><span class="k">Cuotas / Susc.</span><span class="v" style="color:${t.recur?'var(--accent-ink)':'var(--muted)'}">${t.recur?'Sí · '+freqLabel(t.freq):'No'}</span></div>
    ${t.recur?`<div class="kv"><span class="k">Se repite</span><span class="v" style="white-space:normal;text-align:right;max-width:60%">${recurText(t.date,t.freq)}</span></div>`:''}
  </div>
  <button class="btn ghost" id="dDelete2" style="color:var(--down);margin-top:18px">Eliminar movimiento</button>`;
  const close=()=>document.getElementById('detail').classList.remove('on');
  document.getElementById('dBack').onclick=close;
  const del=()=>{
    const tx=S.tx.find(x=>x.id===txid);
    if(tx&&tx.seriesId){
      if(confirm('Es un pago recurrente. Se eliminará toda la serie y dejará de registrarse. ¿Continuar?')){
        S.tx=S.tx.filter(x=>x.seriesId!==tx.seriesId);save();close();renderAll();toast('Pago recurrente eliminado');}
      return;
    }
    if(confirm('¿Eliminar este movimiento?')){S.tx=S.tx.filter(x=>x.id!==txid);save();close();renderAll();toast('Movimiento eliminado');}
  };
  document.getElementById('dDelete').onclick=del;
  document.getElementById('dDelete2').onclick=del;

/* ============ SUBSCRIPTIONS: general screen ============ */
function subRow(s){
  const dim=s.status!=='active';
  const chip=s.status==='paused'?'<span class="st-chip st-paused">Pausada</span>':s.status==='cancelled'?'<span class="st-chip st-cancelled">Cancelada</span>':'';
  const nd=s.next?new Date(s.next).toLocaleDateString('es-ES',{day:'numeric',month:'short'}):'';
  const meta=s.status==='active'&&s.next?`${fmt0(s.price)} ${FREQ_WORD[s.freq]} · Próximo: ${nd}`:`${fmt0(s.price)} ${FREQ_WORD[s.freq]}`;
  return `<div class="sub-row tap ${dim?'dim':''}" data-sub="${s.sid}">
    <div class="sub-monogram">${esc(initials(s.name))}</div>
    <div class="grow"><div class="nm">${esc(s.name)}</div><div class="meta">${meta}</div></div>
    <div style="display:flex;align-items:center;gap:9px">${chip}<span class="chev">${I.chev}</span></div>
  </div>`;
}
function openSubs(){
  const subs=getSubscriptions();
  const active=subs.filter(s=>s.status==='active');
  const monthlyTotal=active.reduce((a,s)=>a+perMonth(s.price,s.freq),0);
  const annualEstimate=active.reduce((a,s)=>a+perYear(s.price,s.freq),0);
  const nextSub=active.filter(s=>s.next).sort((a,b)=>a.next-b.next)[0];
  const order=['month','year','week'];const groups={};subs.forEach(s=>{(groups[s.freq]=groups[s.freq]||[]).push(s);});
  const groupsHTML=order.filter(f=>groups[f]&&groups[f].length).map(f=>`
    <div class="blk-head"><h3>${FREQ_GROUP[f]}</h3><span class="label-xs">${groups[f].length}</span></div>
    <div class="card pad">${groups[f].map(subRow).join('')}</div>`).join('');
  document.getElementById('subsModal').innerHTML=`
   <div class="head"><button class="iconbtn" id="subsBack">${I.back}</button>
     <div class="h-title" style="font-size:19px;align-self:center">Suscripciones</div><div style="width:42px"></div></div>
   <div class="card pad">
     <div class="label-xs">Gasto mensual en suscripciones</div>
     <div class="sum-hero">${fmt0(monthlyTotal)}</div>
     <div class="sum-grid">
       <div class="sum-cell"><div class="k">Estimado anual</div><div class="v">${fmt0(annualEstimate)}</div></div>
       <div class="sum-cell"><div class="k">Activas</div><div class="v">${active.length}</div></div>
     </div>
     ${nextSub?`<div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
        <div><div class="label-xs">Próximo pago</div><div class="tt" style="margin-top:5px">${esc(nextSub.name)}</div></div>
        <div style="text-align:right"><div class="sub-price">${fmt0(nextSub.price)}</div><div class="ts">${shortDate(nextSub.next)}</div></div></div>`:''}
   </div>
   ${active.length?`<div class="proj-phrase" style="margin-top:14px;background:var(--surface);border-color:var(--border)">Gastás <b>${fmt0(monthlyTotal)}</b> por mes en suscripciones${annualEstimate>0?`, que equivalen a <b>${fmt0(annualEstimate)}</b> al año`:''}.</div>`:''}
   ${subs.length?groupsHTML:`<div class="empty" style="margin-top:26px">Sin suscripciones todavía.<br>Marcá un gasto como <b>Cuotas / Suscripciones</b> al cargarlo y aparecerá acá.</div>`}`;
  document.getElementById('subsBack').onclick=()=>document.getElementById('subsModal').classList.remove('on');
  document.getElementById('subsModal').scrollTop=0;
  document.getElementById('subsModal').classList.add('on');
}

  const histHTML=Object.entries(byYear).sort((a,b)=>b[0]-a[0]).map(([y,items])=>`
    <div class="blk-head"><h3>${y}</h3><span class="money" style="color:var(--muted);font-size:13px;font-weight:700">${fmt0(items.reduce((a,t)=>a+t.amount,0))}</span></div>

    <div style="display:flex;align-items:center;gap:14px;margin-top:2px">
      <div class="sub-monogram" style="width:60px;height:60px;font-size:21px">${esc(initials(s.name))}</div>
      <div class="grow"><div class="h-title" style="font-size:24px">${esc(s.name)}</div><div style="margin-top:7px">${stChip}</div></div>
    </div>
    <div class="card pad" style="margin-top:16px">
      <div class="kv"><span class="k">Precio</span><span class="v money">${fmt(s.price)} <span style="color:var(--muted);font-weight:600">${FREQ_WORD[s.freq]}</span></span></div>
      <div class="kv"><span class="k">Facturación</span><span class="v">${freqName}</span></div>
      <div class="kv"><span class="k">Fecha de inicio</span><span class="v">${shortDate(s.start)}</span></div>
      <div class="kv"><span class="k">Próxima renovación</span><span class="v">${s.next?shortDate(s.next):'—'}</span></div>
      <div class="kv"><span class="k">Método de pago</span><span class="v">${I.card} ${esc(s.method||'—')}</span></div>
    </div>

    <div class="blk-head"><h3>Historial de gasto</h3></div>
    <div class="card pad" style="text-align:center">
      <div class="tt" style="font-size:20px">${subDurationStr(s)} de suscripción</div>
      <div class="ts" style="margin-top:8px">Total pagado</div>
      <div class="money" style="font-size:26px;margin-top:2px">${fmt0(s.totalPaid)}</div>
    </div>
    ${s.totalPaid>0?`<div class="proj-phrase" style="background:var(--surface);border-color:var(--border);margin-top:14px">Esta suscripción te costó <b>${fmt0(s.totalPaid)}</b> desde que empezaste a pagarla.</div>`:''}

    <div class="blk-head"><h3>Proyección de costo</h3></div>
    <div class="card pad">
      <div class="label-xs" style="text-align:center">Si la mantenés <span id="pjYears">5</span> años</div>
      <div class="proj-hero" id="pjHero" style="margin-top:6px">${fmt0(py*5)}</div>

      <div class="proj-phrase" id="pjPhrase">Mantener esta suscripción durante <b>5 años</b> te costaría aproximadamente <b>${fmt0(py*5)}</b>.</div>
    </div>
    ${st!=='cancelled'?`<div class="proj-phrase" style="background:var(--surface);border-color:var(--border);margin-top:14px">Cancelarla te permitiría ahorrar <b>${fmt0(py)}</b> al año.</div>`:''}

    ${s.paid.length?`<div class="blk-head"><h3>Pagos realizados</h3></div>${histHTML}`:''}

    <div style="display:flex;gap:10px;margin-top:18px">
      ${st==='active'?`<button class="btn ghost" id="sdPause" style="flex:1">Pausar</button><button class="btn ghost" id="sdCancel" style="flex:1;color:var(--down)">Cancelar</button>`

       :`<button class="btn ghost" id="sdResume" style="flex:1">Reactivar</button>`}

  const modal=document.getElementById('subDetail');const close=()=>modal.classList.remove('on');

  if(kind==='income'){const v=prompt('Ingreso mensual:',S.settings.income);if(v!==null){const n=parseFloat(v.replace(/[^0-9.]/g,''))||0;S.settings.income=n;save();renderAll();}}
  if(kind==='cur'){openCurrencyPicker(code=>{S.settings.currency=code;save();renderAll();toast('Moneda: '+CC().name+' ('+CC().sym+')');});}

/* drag-down-to-close on the bottom sheets (grab from the top handle) */
function enableSheetDrag(sheetId, closeFn){
  const sheet=document.getElementById(sheetId);
  let startY=0,dy=0,dragging=false;
  const pt=e=>e.touches?e.touches[0].clientY:e.clientY;
  const start=e=>{const h=e.target.closest('.sheet-handle');if(!h||!sheet.classList.contains('on'))return;dragging=true;startY=pt(e);dy=0;sheet.style.transition='none';};
  const move=e=>{if(!dragging)return;dy=Math.max(0,pt(e)-startY);sheet.style.transform=`translateY(${dy}px)`;};
  const end=()=>{if(!dragging)return;dragging=false;sheet.style.transition='';sheet.style.transform='';if(dy>100)closeFn();};
  sheet.addEventListener('touchstart',start,{passive:true});
  sheet.addEventListener('touchmove',move,{passive:true});
  sheet.addEventListener('touchend',end);
  sheet.addEventListener('mousedown',start);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
}
enableSheetDrag('sheet',closeSheet);
enableSheetDrag('curSheet',closeCur);

  const row=e.target.closest('[data-tx]');if(row){openDetail(row.dataset.tx);return;}
  const subEl=e.target.closest('[data-sub]');if(subEl){openSubDetail(subEl.dataset.sub);return;}
  const openSubsEl=e.target.closest('[data-open="subs"]');if(openSubsEl){openSubs();return;}
  const catRow=e.target.closest('[data-cat]');if(catRow&&!catRow.classList.contains('ip')){const c=catRow.dataset.cat;if(c==='subs')openSubs();else openCatDetail(c);return;}
  const sl=e.target.closest('#setLimitHome');if(sl){editSetting('limit');return;}
  const link=e.target.closest('[data-tab]');if(link&&!link.classList.contains('t')){go(link.dataset.tab);return;}
  const s=e.target.closest('.set-row');if(s){
    if(s.id==='setName')editSetting('name');
    if(s.id==='setLimit')editSetting('limit');
    if(s.id==='setIncome')editSetting('income');
    if(s.id==='setCur')editSetting('cur');
    if(s.id==='setReset')editSetting('reset');
  }
});

/* ============ ONBOARDING ============ */
function curListHTML(items,sel){
  if(!items.length)return `<div class="cur-empty">Sin resultados</div>`;
  return items.map(c=>`<button class="cur-item ${c.code===sel?'on':''}" data-code="${c.code}"><span class="sym">${c.sym}</span><span class="nm">${c.name}</span><span class="cd">${c.code}</span></button>`).join('');
}
function filterCurrencies(q,sel){
  q=(q||'').trim().toLowerCase();
  if(q)return CURRENCIES.filter(c=>(c.name+' '+c.code+' '+c.sym).toLowerCase().includes(q));
  return CURRENCIES.filter(c=>c.popular||c.code===sel);
}
function startOnboarding(){
  const ob=document.getElementById('ob');ob.classList.add('on');
  let curCode='ARS';let step=0;
  const box=document.getElementById('curBox');
  box.innerHTML=`<div id="curList" class="cur-list" style="margin-top:8px"></div>`;
  const paint=()=>{document.getElementById('curList').innerHTML=curListHTML(CURRENCIES,curCode);
    document.querySelectorAll('#curList .cur-item').forEach(b=>b.onclick=()=>{curCode=b.dataset.code;paint();});};
  paint();
  document.getElementById('obNext').onclick=()=>{
    if(step===0){
      document.getElementById('obStep0').style.display='none';
      document.getElementById('obStep1').style.display='';
      document.getElementById('obs1').classList.add('on');
      document.getElementById('obNext').textContent='Empezar a usar Tino';
      step=1;return;
    }
    const name=document.getElementById('obName').value.trim();
    const income=parseFloat(document.getElementById('obIncome').value.replace(/[^0-9.]/g,''))||0;
    const limit=parseFloat(document.getElementById('obLimit').value.replace(/[^0-9.]/g,''))||0;
    seed(name,curCode,income,limit);
    ob.classList.remove('on');
    renderAll();go('home');
  };
}

/* ============ BOOT ============ */
if(S&&!S.subsMeta)S.subsMeta={};
if(!S){startOnboarding();}
else{runRecurring();renderAll();go('home');}
// re-check due recurring payments whenever the app comes back to the foreground
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S){if(runRecurring())renderAll();}});

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
  <meta name="description" content="PackList — listas de equipaje simples y sin fricción, guardadas en tu dispositivo." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PackList" />
  <title>PackList</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============ Vista: Todas las listas ============ -->
  <section id="view-home" class="view" aria-label="Tus listas">
    <header class="app-header">
      <h1 class="app-title">PackList</h1>
      <p class="app-subtitle">Tus listas</p>
    </header>
    <main id="lists" class="lists" aria-live="polite"></main>
  </section>

  <!-- ============ Vista: Detalle de una lista ============ -->
  <section id="view-list" class="view is-hidden" aria-label="Detalle de la lista">
    <header class="detail-header">
      <button id="btn-back" class="icon-btn" aria-label="Volver a todas las listas" type="button">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <input id="list-name" class="list-name-input" type="text" placeholder="Nombre de la lista"
             autocomplete="off" autocapitalize="sentences" enterkeyhint="done" aria-label="Nombre de la lista" />
      <span id="detail-count" class="count-pill" aria-hidden="true"></span>
    </header>
    <main id="items" class="items" aria-live="polite"></main>
    <form id="add-form" class="add-bar" autocomplete="off">
      <input id="add-input" class="add-input" type="text" placeholder="Añadir ítem…"
             autocapitalize="sentences" enterkeyhint="done" aria-label="Añadir un ítem" />
      <button class="add-btn" type="submit" aria-label="Añadir ítem">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </form>
  </section>

  <!-- Botón flotante para crear una lista nueva -->
  <button id="fab" class="fab" aria-label="Crear una lista nueva" type="button">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>

  <!-- Aviso para deshacer un borrado -->
  <div id="toast" class="toast is-hidden" role="status">
    <span id="toast-text" class="toast-text"></span>
    <button id="toast-undo" class="toast-undo" type="button">Deshacer</button>
  </div>

  <template id="tpl-list-card">
    <article class="row card list-card" role="button" tabindex="0">
      <div class="swipe-under"><span class="swipe-hint">Eliminar</span></div>
      <div class="swipe-face">
        <div class="list-card-main">
          <span class="list-card-name"></span>
          <span class="list-card-meta"></span>
        </div>
        <div class="list-card-side">
          <span class="count-pill list-card-count"></span>
          <svg class="chevron" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </article>
  </template>

  <template id="tpl-item">
    <div class="row item" role="button" tabindex="0">
      <div class="swipe-under"><span class="swipe-hint">Eliminar</span></div>
      <div class="swipe-face">
        <span class="check" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 12l5 5 9-10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="item-text"></span>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>

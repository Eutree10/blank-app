<style>
:root{
  --bg:#F6F5F2;
  --surface:#FFFFFF;
  --surface-alt:#EFEDE9;
  --line:#E7E4DE;
  --line-strong:#DBD7D0;
  --ink:#16151A;
  --ink-soft:#54515A;
  --muted:#8E8B94;
  --red:#D62B2B;
  --red-deep:#B01D1D;
  --red-tint:#FBEBEB;
  --green:#2E9E63;
  --green-tint:#E7F4EC;
  --lock:#C4C1BB;
  --lock-bg:#EDEBE7;
  --shadow-sm:0 1px 2px rgba(20,18,24,.05);
  --shadow-md:0 6px 20px rgba(20,18,24,.07);
  --shadow-lg:0 18px 48px rgba(20,18,24,.14);
  --r-lg:26px;
  --r-md:18px;
  --r-sm:12px;
  --font:'Inter',-apple-system,'SF Pro Display','SF Pro Text',system-ui,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,'Menlo',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);
  background:
    radial-gradient(1200px 700px at 15% -10%, #ECEAE5 0%, transparent 60%),
    radial-gradient(1000px 700px at 100% 110%, #EEECE7 0%, transparent 55%),
    #E9E7E2;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  min-height:100dvh;padding:28px 16px;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}

/* ============ iPhone frame ============ */
.stage{display:flex;flex-direction:column;align-items:center;gap:18px}
.brandline{display:flex;align-items:center;gap:10px;opacity:.55;user-select:none}
.brandline .mk{width:22px;height:22px;border-radius:7px;background:var(--ink);position:relative}
.brandline .mk::before{content:"";position:absolute;inset:5px 6px;border-left:2.5px solid var(--red);border-bottom:2.5px solid #fff;transform:skewX(-8deg)}
.brandline b{font-weight:800;letter-spacing:-.02em}
.brandline span{font-size:13px;color:var(--ink-soft)}

.phone{
  width:390px;height:844px;position:relative;flex:none;
  background:#0b0b0d;border-radius:56px;
  padding:11px;
  box-shadow:
    0 0 0 2px #26262a,
    0 0 0 11px #0b0b0d,
    0 0 0 13px #303035,
    var(--shadow-lg);
}
.screen{
  position:relative;width:100%;height:100%;
  background:var(--bg);border-radius:46px;overflow:hidden;
  display:flex;flex-direction:column;
}
.island{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:118px;height:34px;background:#000;border-radius:20px;z-index:60;
}
.statusbar{
  position:absolute;top:0;left:0;right:0;height:54px;z-index:55;
  display:flex;align-items:center;justify-content:space-between;
  padding:19px 30px 0;font-size:14px;font-weight:700;pointer-events:none;
}
.statusbar .r{display:flex;align-items:center;gap:7px}
.statusbar svg{display:block}

/* scroll area */
.view{
  position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;visibility:hidden;transform:translateY(6px);
  transition:opacity .32s ease, transform .32s ease, visibility .32s;
}
.view.active{opacity:1;visibility:visible;transform:none;z-index:2}
.scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:58px 20px 118px;
  scrollbar-width:none;
}
.scroll::-webkit-scrollbar{display:none}
.scroll.no-tab{padding-bottom:34px}

/* ============ typography ============ */
h1{font-size:29px;font-weight:800;letter-spacing:-.03em;line-height:1.03}
h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--ink-soft);font-size:14px;line-height:1.5}
.mono{font-family:var(--mono);font-feature-settings:"tnum" 1;letter-spacing:-.02em}
.dim{color:var(--muted)}

/* ============ shared components ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;flex:none}
.pill.red{background:var(--red-tint);color:var(--red-deep)}
.pill.green{background:var(--green-tint);color:var(--green)}
.pill.gray{background:var(--surface-alt);color:var(--ink-soft)}
.pill.line{background:transparent;border:1px solid var(--line-strong);color:var(--ink-soft)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  height:56px;border-radius:18px;border:none;cursor:pointer;
  font-family:var(--font);font-size:16px;font-weight:700;letter-spacing:-.01em;width:100%;
  transition:transform .12s ease, filter .2s ease, box-shadow .2s ease;
}
.btn:active{transform:scale(.975)}
.btn.primary{background:var(--red);color:#fff;box-shadow:0 8px 22px rgba(214,43,43,.28)}
.btn.primary:active{filter:brightness(.96)}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.btn.sm{height:44px;font-size:14px;border-radius:14px;width:auto;padding:0 18px}

.icon-btn{
  width:40px;height:40px;border-radius:13px;background:var(--surface);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink);flex:none;transition:background .15s
}
.icon-btn:active{background:var(--surface-alt)}
svg{stroke-width:1.9}

/* progress ring */
.ring{transform:rotate(-90deg)}
.ring .track{stroke:var(--line);fill:none}
.ring .fill{stroke:var(--red);fill:none;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.4,0,.1,1)}

/* ============ TAB BAR ============ */
.tabbar{
  position:absolute;left:12px;right:12px;bottom:12px;height:70px;z-index:40;
  background:rgba(255,255,255,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--line);border-radius:26px;
  display:flex;align-items:stretch;padding:8px;box-shadow:var(--shadow-md);
}
.tabbar button{
  flex:1;background:none;border:none;cursor:pointer;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:10.5px;font-weight:700;letter-spacing:.01em;border-radius:18px;transition:color .18s
}
.tabbar button.on{color:var(--red)}
.tabbar button svg{width:23px;height:23px}
.hide-tab .tabbar{display:none}

/* ============ ONBOARDING ============ */
#onboarding{background:var(--bg)}
.ob-scroll{flex:1;display:flex;flex-direction:column;padding:74px 26px 30px;overflow-y:auto;scrollbar-width:none}
.ob-scroll::-webkit-scrollbar{display:none}
.ob-logo{font-size:44px;font-weight:900;letter-spacing:-.05em;display:inline-flex;align-items:center;gap:2px}
.ob-logo .dot{width:9px;height:9px;background:var(--red);border-radius:50%;margin:0 0 7px 3px;align-self:flex-end}
.hero-mark{
  width:100%;height:196px;border-radius:24px;margin:22px 0;position:relative;overflow:hidden;
  background:linear-gradient(155deg,#1b1a1f 0%, #2a2830 100%);display:flex;align-items:flex-end;padding:20px
}
.hero-mark .fig{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.hero-mark .lbl{position:relative;color:#fff}
.hero-mark .lbl .t{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.hero-mark .lbl .b{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:3px}

.steps{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.step{display:flex;gap:15px;padding:15px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.step .n{width:30px;height:30px;flex:none;border-radius:10px;background:var(--ink);color:#fff;
  font-family:var(--mono);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.step .tx b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.step .tx span{font-size:13px;color:var(--ink-soft);line-height:1.45}

.dots{display:flex;gap:7px;justify-content:center;margin:20px 0 14px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-strong);transition:all .3s}
.dots i.on{width:22px;background:var(--red);border-radius:99px}

/* questionnaire */
.q-head{margin-bottom:20px}
.q-num{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--red);letter-spacing:.05em}
.q-title{font-size:23px;font-weight:800;letter-spacing:-.025em;margin-top:8px;line-height:1.12}
.opt-grid{display:grid;gap:11px}
.opt-grid.two{grid-template-columns:1fr 1fr}
.opt{
  background:var(--surface);border:1.5px solid var(--line);border-radius:16px;
  padding:16px 15px;cursor:pointer;text-align:left;font-family:var(--font);
  display:flex;align-items:center;gap:13px;transition:all .16s ease;color:var(--ink);position:relative
}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--red);background:var(--red-tint)}
.opt.sel .oi{background:var(--red);color:#fff;border-color:var(--red)}
.opt .oi{width:38px;height:38px;flex:none;border-radius:11px;background:var(--surface-alt);
  display:flex;align-items:center;justify-content:center;color:var(--ink);transition:all .16s;border:1px solid transparent}
.opt .ot b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.opt .ot span{font-size:12.5px;color:var(--muted)}
.opt .chk{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;color:#fff;flex:none;transition:all .16s}
.opt.sel .chk{background:var(--red);border-color:var(--red)}
.opt.sel .chk svg{opacity:1}
.opt .chk svg{opacity:0;transition:opacity .16s;width:13px;height:13px}
.opt-grid.two .opt{flex-direction:column;align-items:flex-start;gap:10px;padding:15px}
.opt-grid.two .opt .chk{position:absolute;top:13px;right:13px;margin:0}

.counter{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.counter .cc{display:flex;align-items:center;justify-content:space-between;background:var(--surface);
  border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
.counter .cc b{font-size:15px;font-weight:700}
.counter .cc .stp{display:flex;align-items:center;gap:14px}
.counter .cc .stp button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line-strong);
  background:var(--surface);font-size:20px;font-weight:600;cursor:pointer;color:var(--ink);line-height:0;
  display:flex;align-items:center;justify-content:center}
.counter .cc .stp button:active{background:var(--surface-alt)}
.counter .cc .stp .val{font-family:var(--mono);font-size:20px;font-weight:700;min-width:34px;text-align:center}

.ob-foot{padding:14px 26px 26px;background:linear-gradient(180deg,transparent, var(--bg) 34%);display:flex;gap:12px}
.ob-foot .back{width:56px;flex:none}

/* ============ HOY ============ */
.greet{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.greet .who{font-size:13px;font-weight:600;color:var(--muted)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:16px;flex:none;cursor:pointer}

.session-card{border-radius:var(--r-lg);overflow:hidden;background:#1b1a1f;color:#fff;position:relative;margin-bottom:16px;box-shadow:var(--shadow-md)}
.session-card .visual{height:150px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#232128 0%,#141318 100%)}
.session-card .visual .fig{position:absolute;right:-6px;bottom:-10px;opacity:.9}
.session-card .visual .top{position:absolute;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start}
.session-card .body{padding:16px 18px 18px}
.session-card h2{color:#fff;font-size:22px}
.session-card .goal{color:rgba(255,255,255,.62);font-size:13px;margin-top:5px;line-height:1.4}
.metrics{display:flex;gap:0;margin:16px 0;border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1)}
.metrics .m{flex:1;padding:12px 0;text-align:center;border-right:1px solid rgba(255,255,255,.1)}
.metrics .m:last-child{border-right:none}
.metrics .m .v{font-family:var(--mono);font-size:19px;font-weight:700}
.metrics .m .k{font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em;margin-top:3px}
.session-card .btn.primary{background:#fff;color:var(--ink);box-shadow:none}
.session-card .btn.primary:active{filter:brightness(.94)}

.sec-head{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 12px}
.sec-head .lnk{font-size:13px;font-weight:700;color:var(--red);cursor:pointer}

.week{display:flex;justify-content:space-between;gap:7px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.week .d .bar{width:100%;height:56px;border-radius:9px;background:var(--surface-alt);display:flex;align-items:flex-end;overflow:hidden}
.week .d .bar i{width:100%;background:var(--red);border-radius:9px 9px 0 0;transition:height .8s cubic-bezier(.4,0,.1,1)}
.week .d.done .bar i{background:var(--red)}
.week .d.today .lab{color:var(--red);font-weight:800}
.week .d .lab{font-size:11px;color:var(--muted);font-weight:600}
.week .d.rest .bar i{background:var(--line-strong)}

.mini{display:flex;gap:11px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px 4px}
.mini::-webkit-scrollbar{display:none}
.unlock-card{flex:none;width:172px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:15px;cursor:pointer;transition:transform .14s}
.unlock-card:active{transform:scale(.98)}
.unlock-card .ic{width:40px;height:40px;border-radius:12px;background:var(--surface-alt);display:flex;
  align-items:center;justify-content:center;margin-bottom:12px}
.unlock-card b{font-size:15px;font-weight:700;letter-spacing:-.01em;display:block}
.unlock-card .nx{font-size:12px;color:var(--muted);margin-top:2px}
.pbar{height:6px;background:var(--surface-alt);border-radius:99px;overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .9s cubic-bezier(.4,0,.1,1)}

/* ============ HABILIDADES ============ */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:0 14px;height:46px;margin:14px 0 14px;color:var(--muted)}
.search input{border:none;outline:none;background:none;font-family:var(--font);font-size:15px;flex:1;color:var(--ink)}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 18px;padding:0 20px 2px}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 15px;border-radius:99px;border:1px solid var(--line-strong);
  background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;
  display:flex;align-items:center;transition:all .15s}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.cat-label{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:20px 4px 12px}
.skill-card{display:flex;align-items:center;gap:14px;padding:15px;border-radius:var(--r-md);background:var(--surface);
  border:1px solid var(--line);cursor:pointer;margin-bottom:10px;transition:transform .14s,box-shadow .2s}
.skill-card:active{transform:scale(.99)}
.skill-card .glyph{width:52px;height:52px;flex:none;border-radius:14px;background:var(--surface-alt);
  display:flex;align-items:center;justify-content:center;color:var(--ink)}
.skill-card.locked .glyph{background:var(--lock-bg);color:var(--lock)}
.skill-card.locked{opacity:.72}
.skill-card .info{flex:1;min-width:0}
.skill-card .info .nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.skill-card .info b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.skill-card .info .lv{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skill-card .rgt{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.skill-card .pct{font-family:var(--mono);font-size:14px;font-weight:700}
.mini-ring{position:relative;width:46px;height:46px;flex:none}
.mini-ring .c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;font-weight:700}

/* ============ SKILL DETAIL ============ */
.detail-hero{height:230px;position:relative;overflow:hidden;background:linear-gradient(160deg,#232128,#131217);
  display:flex;flex-direction:column;justify-content:flex-end;padding:22px;color:#fff}
.detail-hero .fig{position:absolute;right:-20px;top:8px;opacity:.85}
.detail-hero .back{position:absolute;top:56px;left:18px}
.detail-hero h1{color:#fff;font-size:32px}
.detail-hero .meta{display:flex;gap:8px;margin-top:12px}
.detail-hero .glass{background:rgba(255,255,255,.14);color:#fff;border:none}
.detail-body{padding:20px 20px 118px}
.stat3{display:flex;gap:10px;margin:-38px 4px 22px;position:relative;z-index:5}
.stat3 .s{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:center;box-shadow:var(--shadow-sm)}
.stat3 .s .v{font-family:var(--mono);font-size:19px;font-weight:700}
.stat3 .s .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}

/* progression path */
.path{position:relative;padding-left:8px}
.node{position:relative;padding:0 0 8px 42px;margin-bottom:4px}
.node .bullet{position:absolute;left:6px;top:2px;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;z-index:2;background:var(--surface);
  border:2px solid var(--line-strong);color:var(--muted)}
.node .line{position:absolute;left:18px;top:22px;bottom:-6px;width:2px;background:var(--line-strong);z-index:1}
.node:last-child .line{display:none}
.node.done .bullet{background:var(--green);border-color:var(--green);color:#fff}
.node.done .line{background:var(--green)}
.node.current .bullet{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 0 5px var(--red-tint)}
.node.locked .bullet{background:var(--lock-bg);border-color:transparent;color:var(--lock)}
.pnode{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px;cursor:pointer}
.node.current .pnode{border-color:var(--red);box-shadow:0 6px 18px rgba(214,43,43,.1)}
.node.locked .pnode{background:transparent;border-style:dashed;box-shadow:none}
.pnode .top{display:flex;align-items:center;justify-content:space-between}
.pnode .top b{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.node.locked .pnode .top b{color:var(--ink-soft)}
.pnode .lvl{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted)}
.pnode .rx{font-size:12.5px;color:var(--muted);margin-top:6px}
.pnode .detail{max-height:0;overflow:hidden;transition:max-height .4s ease;margin-top:0}
.pnode.open .detail{max-height:640px;margin-top:14px}
.pnode .detail .vid{height:130px;border-radius:12px;background:linear-gradient(150deg,#232128,#15141a);
  display:flex;align-items:center;justify-content:center;margin-bottom:14px;position:relative;overflow:hidden}
.pnode .detail .vid .play{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;color:#fff}
.dsec{margin-bottom:13px}
.dsec .h{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.dsec p,.dsec li{font-size:13.5px;color:var(--ink-soft);line-height:1.5}
.dsec ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.dsec li{display:flex;gap:8px}
.dsec li svg{flex:none;margin-top:3px}
.setgrid{display:flex;gap:9px}
.setgrid .sg{flex:1;background:var(--surface-alt);border-radius:12px;padding:11px;text-align:center}
.setgrid .sg .v{font-family:var(--mono);font-size:17px;font-weight:700}
.setgrid .sg .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

/* ============ SESSION ============ */
#session{background:#111015}
.sess-top{padding:60px 22px 0;color:#fff}
.sess-bar{display:flex;gap:5px;margin:16px 0}
.sess-bar i{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.16)}
.sess-bar i.done{background:var(--red)}
.sess-bar i.cur{background:#fff}
.sess-phase{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.sess-body{flex:1;display:flex;flex-direction:column;padding:8px 22px 22px;color:#fff;overflow-y:auto;scrollbar-width:none}
.sess-body::-webkit-scrollbar{display:none}
.ex-visual{height:230px;border-radius:22px;background:linear-gradient(160deg,#26242d,#151419);
  margin:14px 0 20px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none}
.ex-visual .tag{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.4);color:#fff;padding:5px 11px;border-radius:99px;font-size:11px;font-weight:700}
.ex-name{font-size:27px;font-weight:800;letter-spacing:-.03em}
.ex-hint{color:rgba(255,255,255,.6);font-size:14px;margin-top:8px;line-height:1.5}
.ex-sets{display:flex;gap:11px;margin:22px 0}
.ex-sets .es{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px 0;text-align:center}
.ex-sets .es .v{font-family:var(--mono);font-size:26px;font-weight:700}
.ex-sets .es .k{font-size:10.5px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em;margin-top:4px}
.tip{display:flex;gap:11px;background:rgba(255,255,255,.05);border-radius:14px;padding:13px 14px;margin-bottom:auto}
.tip svg{flex:none;color:var(--red);margin-top:1px}
.tip p{font-size:13px;color:rgba(255,255,255,.78);line-height:1.5}
.sess-actions{display:flex;gap:11px;margin-top:20px}
.sess-actions .btn.dark{background:rgba(255,255,255,.1);color:#fff}
.sess-actions .side{width:56px;flex:none;background:rgba(255,255,255,.08);border:none;border-radius:18px;color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer}

/* rest timer overlay */
.rest{position:absolute;inset:0;z-index:70;background:rgba(10,9,13,.86);backdrop-filter:blur(14px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:40px;
  opacity:0;visibility:hidden;transition:opacity .3s;text-align:center}
.rest.show{opacity:1;visibility:visible}
.rest .lab{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.rest .big{font-family:var(--mono);font-size:74px;font-weight:700;margin:10px 0 4px;letter-spacing:-.03em}
.rest .nx{color:rgba(255,255,255,.6);font-size:14px;margin-bottom:34px}
.rest .btn{width:auto;padding:0 34px}

/* set complete toast */
.toast{position:absolute;left:50%;bottom:140px;transform:translate(-50%,20px);z-index:80;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-size:14px;font-weight:700;
  display:flex;align-items:center;gap:9px;opacity:0;visibility:hidden;transition:all .3s;box-shadow:var(--shadow-lg);white-space:nowrap}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.toast .rz{width:22px;height:22px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}

/* ============ PROGRESO ============ */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:16px 0 8px}
.stat-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.stat-tile .k{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.stat-tile .v{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:8px}
.stat-tile .v small{font-size:14px;color:var(--muted);font-weight:600}
.stat-tile .delta{font-size:12px;font-weight:700;color:var(--green);margin-top:4px}

.chart-card{padding:18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);margin-top:14px}
.chart-card .ch-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.chart-card h2{font-size:16px}
.chart-card .now{font-family:var(--mono);font-size:22px;font-weight:700}
.seg{display:flex;background:var(--surface-alt);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;border:none;background:none;font-family:var(--font);font-size:12px;font-weight:700;color:var(--muted);
  padding:6px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.chart{margin-top:14px;position:relation}
.chart svg{width:100%;display:block;overflow:visible}
.dpoint{fill:var(--surface);stroke:var(--red);stroke-width:2.5;cursor:pointer}
.dpoint.act{fill:var(--red)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.cal .dh{font-size:10px;text-align:center;color:var(--muted);font-weight:700;text-transform:uppercase}
.cal .cd{aspect-ratio:1;border-radius:9px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-soft)}
.cal .cd.a1{background:#F6D3D3;color:var(--red-deep)}
.cal .cd.a2{background:#EC9A9A;color:#fff}
.cal .cd.a3{background:var(--red);color:#fff}
.cal .cd.tdy{outline:2px solid var(--ink);outline-offset:1px}

.pr-item{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.pr-item:last-child{border-bottom:none}
.pr-item .ic{width:40px;height:40px;border-radius:12px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;flex:none}
.pr-item .nm b{font-size:14.5px;font-weight:700}
.pr-item .nm span{font-size:12px;color:var(--muted)}
.pr-item .val{margin-left:auto;text-align:right}
.pr-item .val .v{font-family:var(--mono);font-size:18px;font-weight:700}
.pr-item .val .d{font-size:11px;color:var(--green);font-weight:700}

/* ============ PERFIL ============ */
.prof-head{display:flex;align-items:center;gap:16px;margin:8px 0 20px}
.prof-head .av{width:74px;height:74px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:28px;font-weight:800;flex:none}
.prof-head .nm h1{font-size:24px}
.prof-head .nm .lv{display:flex;align-items:center;gap:8px;margin-top:7px}
.level-bar{display:flex;align-items:center;gap:12px;background:var(--ink);border-radius:var(--r-md);padding:16px 18px;color:#fff;margin-bottom:18px}
.level-bar .lvn{font-family:var(--mono);font-size:30px;font-weight:700}
.level-bar .lt{flex:1}
.level-bar .lt b{font-size:14px;font-weight:700}
.level-bar .lt .bar{height:6px;background:rgba(255,255,255,.16);border-radius:99px;margin-top:8px;overflow:hidden}
.level-bar .lt .bar i{display:block;height:100%;background:var(--red);border-radius:99px}
.list-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:16px}
.li{display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:none}
.li:active{background:var(--surface-alt)}
.li .ic{width:34px;height:34px;border-radius:10px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.li .tx{flex:1}
.li .tx b{font-size:14.5px;font-weight:600;display:block}
.li .tx span{font-size:12px;color:var(--muted)}
.li .rt{color:var(--muted);font-size:13px;font-weight:600;font-family:var(--mono)}
.equip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.fav-row{display:flex;gap:11px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 4px;padding:0 20px}
.fav-row::-webkit-scrollbar{display:none}
.fav{flex:none;width:120px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.fav .g{width:38px;height:38px;border-radius:11px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.fav b{font-size:14px;font-weight:700;display:block}
.fav span{font-size:11.5px;color:var(--muted)}

.section-title{margin:22px 4px 12px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* unlock celebration */
.celebrate{position:absolute;inset:0;z-index:90;background:rgba(10,9,13,.9);backdrop-filter:blur(16px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:40px;text-align:center;
  opacity:0;visibility:hidden;transition:opacity .35s}
.celebrate.show{opacity:1;visibility:visible}
.celebrate .badge{width:120px;height:120px;border-radius:32px;background:var(--red);display:flex;align-items:center;justify-content:center;
  margin-bottom:26px;box-shadow:0 0 0 12px rgba(214,43,43,.16);transform:scale(.5);transition:transform .5s cubic-bezier(.2,1.4,.4,1)}
.celebrate.show .badge{transform:scale(1)}
.celebrate .et{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.celebrate h1{color:#fff;font-size:28px;margin:10px 0 8px}
.celebrate p{color:rgba(255,255,255,.6);font-size:15px;margin-bottom:34px;max-width:260px;line-height:1.5}
.celebrate .btn{width:auto;padding:0 40px}

/* ============ PLAN ============ */
.plan-strip{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 15px;cursor:pointer;margin-bottom:4px;transition:transform .14s}
.plan-strip:active{transform:scale(.99)}
.plan-strip .pk{width:44px;height:44px;flex:none;border-radius:13px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
.plan-strip .pi{flex:1;min-width:0}
.plan-strip .pi b{font-size:14.5px;font-weight:700;display:block}
.plan-strip .pi .nx{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-strip .pi .pbar{margin-top:9px}

.plan-hero{background:#1b1a1f;color:#fff;border-radius:var(--r-lg);padding:18px;margin-bottom:16px;position:relative;overflow:hidden}
.plan-hero .fig{position:absolute;right:-16px;top:-8px;opacity:.42}
.plan-hero .eyebrow{color:rgba(255,255,255,.55)}
.plan-hero h2{color:#fff;font-size:21px;margin-top:6px;position:relative}
.plan-hero .goalx{color:rgba(255,255,255,.6);font-size:13px;margin-top:6px;position:relative;max-width:78%}
.plan-hero .pmeta{display:flex;gap:22px;margin-top:16px;position:relative}
.plan-hero .pmeta .pm .v{font-family:var(--mono);font-size:17px;font-weight:700}
.plan-hero .pmeta .pm .k{font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.09em;margin-top:2px}
.plan-hero .pbar2{height:6px;background:rgba(255,255,255,.16);border-radius:99px;margin-top:16px;overflow:hidden;position:relative}
.plan-hero .pbar2 i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .9s cubic-bezier(.4,0,.1,1)}

.seg.full{width:100%;margin-bottom:18px}

/* monthly weeks timeline */
.wk{display:flex;gap:14px}
.wk .rail{display:flex;flex-direction:column;align-items:center;flex:none;width:30px}
.wk .rail .bub{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px;background:var(--surface);border:2px solid var(--line-strong);color:var(--muted);z-index:2}
.wk .rail .conn{flex:1;width:2px;background:var(--line-strong);margin:3px 0;min-height:14px}
.wk:last-child .rail .conn{display:none}
.wk.done .bub{background:var(--green);border-color:var(--green);color:#fff}
.wk.done .conn{background:var(--green)}
.wk.current .bub{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 0 5px var(--red-tint)}
.wk .wkcard{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:14px}
.wk.current .wkcard{border-color:var(--red);box-shadow:0 6px 16px rgba(214,43,43,.08)}
.wk.locked .wkcard{background:transparent;border-style:dashed}
.wk .wkcard .wn{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wk .wkcard b{font-size:15.5px;font-weight:700;letter-spacing:-.01em;display:block;margin-top:3px}
.wk.locked .wkcard b{color:var(--ink-soft)}
.wk .wkcard .mil{font-size:12.5px;color:var(--ink-soft);margin-top:8px;display:flex;gap:7px;align-items:flex-start}
.wk .wkcard .mil svg{flex:none;margin-top:2px;color:var(--muted)}

/* weekly day rows */
.day-row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:9px}
.day-row.rest{background:transparent;border-style:dashed}
.day-row.today{border-color:var(--red);box-shadow:0 6px 16px rgba(214,43,43,.08);cursor:pointer}
.day-row .dd{width:38px;flex:none;text-align:center}
.day-row .dd .dn{font-family:var(--mono);font-size:15px;font-weight:700}
.day-row .dd .dl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.day-row.today .dd .dn,.day-row.today .dd .dl{color:var(--red)}
.day-row .di{flex:1;min-width:0}
.day-row .di b{font-size:14.5px;font-weight:700;display:block}
.day-row.rest .di b{color:var(--ink-soft);font-weight:600}
.day-row .di span{font-size:12px;color:var(--muted)}
.day-row .ds{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.day-row .ds .dur{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink-soft)}
.stdot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.stdot.done{background:var(--green);color:#fff}
.stdot.next{border:2px solid var(--line-strong)}
.stdot.today{background:var(--red);color:#fff}

/* daily session blocks */
.day-summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-bottom:16px}
.day-summary .dsg{display:flex;gap:0;margin-top:2px}
.day-summary .dsg .c{flex:1;text-align:center;border-right:1px solid var(--line);padding:6px 0}
.day-summary .dsg .c:last-child{border-right:none}
.day-summary .dsg .c .v{font-family:var(--mono);font-size:17px;font-weight:700}
.day-summary .dsg .c .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.block{border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;background:var(--surface)}
.block.main{border-color:var(--red);box-shadow:0 6px 16px rgba(214,43,43,.07)}
.block .bh{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer}
.block .bh .bn{width:30px;height:30px;border-radius:9px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:12px;flex:none;color:var(--ink-soft)}
.block.main .bh .bn{background:var(--red);color:#fff}
.block .bh .bt{flex:1;min-width:0}
.block .bh .bt b{font-size:14px;font-weight:700;display:block}
.block .bh .bt span{font-size:11.5px;color:var(--muted)}
.block .bh .chev{color:var(--muted);transition:transform .3s;flex:none}
.block.open .bh .chev{transform:rotate(90deg)}
.block .bx{max-height:0;overflow:hidden;transition:max-height .35s ease}
.block.open .bx{max-height:360px}
.block .bxin{padding:0 15px 6px}
.block .exr{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);gap:12px}
.block .exr .en{font-size:13.5px;font-weight:600}
.block .exr .em{font-size:11px;color:var(--muted);margin-top:1px}
.block .exr .es{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink-soft);flex:none;text-align:right}

/* sticky start bar — floats above the tab bar */
.start-bar{position:absolute;left:12px;right:12px;bottom:92px;z-index:45;background:linear-gradient(180deg,transparent,var(--bg) 34%);padding:26px 6px 4px}

/* bottom sheet */
.sheet-backdrop{position:absolute;inset:0;z-index:85;background:rgba(10,9,13,.42);opacity:0;visibility:hidden;transition:opacity .28s}
.sheet-backdrop.show{opacity:1;visibility:visible}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:86;background:var(--surface);border-radius:26px 26px 0 0;padding:8px 14px 26px;transform:translateY(102%);transition:transform .34s cubic-bezier(.3,1,.35,1);max-height:82%;overflow-y:auto;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.show{transform:none}
.sheet .grip{width:38px;height:5px;border-radius:99px;background:var(--line-strong);margin:8px auto 14px}
.sheet .sh-title{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:0 6px 4px}
.sheet .sh-sub{font-size:13px;color:var(--muted);margin:0 6px 14px}
.sheet-li{display:flex;align-items:center;gap:14px;padding:14px 8px;border-top:1px solid var(--line);cursor:pointer}
.sheet-li:active{background:var(--surface-alt);border-radius:12px}
.sheet-li .ic{width:36px;height:36px;border-radius:11px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.sheet-li.danger .ic{background:var(--red-tint);color:var(--red-deep)}
.sheet-li b{font-size:14.5px;font-weight:600;display:block}
.sheet-li span{font-size:12px;color:var(--muted)}

/* survey (dark, over session) */
.survey{position:absolute;inset:0;z-index:78;background:#111015;display:flex;flex-direction:column;color:#fff;padding:64px 24px 26px;opacity:0;visibility:hidden;transition:opacity .3s;overflow-y:auto;scrollbar-width:none}
.survey::-webkit-scrollbar{display:none}
.survey.show{opacity:1;visibility:visible}
.survey .sq-num{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--red)}
.survey h2{color:#fff;font-size:23px;margin-top:8px;letter-spacing:-.02em}
.sv-opt{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.sv-opt.wrap{flex-direction:row;flex-wrap:wrap}
.sv-opt button{padding:15px 16px;border-radius:14px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#fff;font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;text-align:left;transition:all .14s;display:flex;align-items:center;justify-content:space-between}
.sv-opt.wrap button{flex:1;min-width:44%;text-align:center;justify-content:center}
.sv-opt button:active{transform:scale(.98)}
.sv-opt button.on{background:var(--red);border-color:var(--red)}
.survey .foot{margin-top:auto;padding-top:20px}
.adapt-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.adapt-item svg{flex:none;color:var(--green);margin-top:1px}
.adapt-item b{font-size:14.5px;font-weight:700;display:block}
.adapt-item span{font-size:12.5px;color:rgba(255,255,255,.6)}

/* plan wizard */
#crearplan{background:var(--bg)}
.dur-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.dur{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px 15px;cursor:pointer;text-align:center;transition:all .15s;position:relative}
.dur.sel{border-color:var(--red);background:var(--red-tint)}
.dur .big{font-family:var(--mono);font-size:26px;font-weight:700}
.dur .sm{font-size:12px;color:var(--muted);margin-top:2px}
.dur.sel .sm{color:var(--red-deep)}

/* final evaluation */
.cmp{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.cmp .lab{flex:1;font-size:13.5px;font-weight:600}
.cmp .ba{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--muted)}
.cmp .arw{color:var(--muted)}
.cmp .bb{font-family:var(--mono);font-size:17px;font-weight:700}
.cmp .up{font-size:11px;font-weight:700;color:var(--green);margin-left:2px}
.reco{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:10px;cursor:pointer;transition:transform .14s}
.reco:active{transform:scale(.99)}
.reco.hi{border-color:var(--red);background:var(--red-tint)}
.reco .ic{width:40px;height:40px;border-radius:12px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;flex:none}
.reco.hi .ic{background:var(--red);color:#fff}
.reco .tx{flex:1}
.reco .tx b{font-size:14.5px;font-weight:700;display:block}
.reco .tx span{font-size:12px;color:var(--muted)}

/* ============ REAL APP SHELL — fullscreen, no phone frame ============ */
html,body{height:100%}
body{padding:0;align-items:stretch;background:var(--bg)}
.stage{gap:0;width:100%;min-height:100dvh}
.brandline{display:none!important}
.phone{width:100%;max-width:480px;height:100dvh;min-height:100dvh;padding:0;border-radius:0;box-shadow:none;background:var(--bg)}
.screen{border-radius:0}
.island,.statusbar{display:none!important}
.tabbar{bottom:calc(env(safe-area-inset-bottom, 0px) + 10px)}
.start-bar{bottom:calc(env(safe-area-inset-bottom, 0px) + 82px)}
.scroll{padding-top:calc(env(safe-area-inset-top, 0px) + 22px);padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 116px)}
.scroll.no-tab{padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 30px)}
.ob-scroll{padding-top:calc(env(safe-area-inset-top, 0px) + 42px)}
.ob-foot{padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 24px)}
.sess-top{padding-top:calc(env(safe-area-inset-top, 0px) + 24px)}
.sess-body{padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 22px)}
.survey{padding-top:calc(env(safe-area-inset-top, 0px) + 34px)}
.detail-hero .back{top:calc(env(safe-area-inset-top, 0px) + 20px)}
.sheet{padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 26px)}
@media(min-width:520px){body{background:radial-gradient(1200px 700px at 15% -10%, #ECEAE5 0%, transparent 60%),radial-gradient(1000px 700px at 100% 110%, #EEECE7 0%, transparent 55%),#E9E7E2}.phone{height:100dvh}}

@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.pop{animation:pop .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s ease both}

        const sel = s.multi ? (answers[s.key]||[]).includes(o.v) : answers[s.key]===o.v;
        return `<button class="opt ${sel?'sel':''}" onclick="pick('${s.key}','${o.v}',${!!s.multi})">

}

function pick(key,v,multi){

  color=color||'var(--red)'; const r=19,c=2*Math.PI*r,off=c-(pct/100)*c;

}

function lineChart(data,unit){
  const w=310,h=110,pad=6;
  const max=Math.max(...data), min=Math.min(...data);
  const rng=(max-min)||1;
  const pts=data.map((v,i)=>[pad+(i/(data.length-1))*(w-pad*2), h-pad-((v-min)/rng)*(h-pad*2-10)]);
  const d=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const area=`${d} L${pts[pts.length-1][0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h} Z`;
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h+6}">
    <defs><linearGradient id="g${unit}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--red)" stop-opacity=".16"/><stop offset="1" stop-color="var(--red)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#g${unit})"/>
    <path d="${d}" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>i===pts.length-1?`<circle class="dpoint act" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5"/>`:'').join('')}
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="9" fill="var(--red)" opacity=".12"/>
  </svg>`;
}
function calDays(){
  // July starts on Tue -> 1 blank
  let out='<div></div>';
  const intens={2:1,3:2,5:1,7:3,8:1,9:2,10:3,12:1,14:2,15:1,16:3,17:2,19:1};
  for(let d=1;d<=31;d++){
    const a=intens[d]?`a${intens[d]}`:'';
    const tdy=d===21?'tdy':'';
    out+=`<div class="cd ${a} ${tdy}">${d}</div>`;
  }
  return out;
}

  if(svStep<SURVEY_Q.length){
    const q=SURVEY_Q[svStep];
    el.innerHTML=`<div class="sq-num">Registro · ${svStep+1} de ${SURVEY_Q.length}</div>
      <h2>${q.q}</h2>
      <div class="sv-opt ${q.wrap?'wrap':''}">${q.o.map(o=>`<button class="${svAns[q.k]===o?'on':''}" onclick="svPick('${q.k}','${o}')">${o}${q.wrap?'':`<span>${svAns[q.k]===o?ICON.check:''}</span>`}</button>`).join('')}</div>
      <div class="foot"><button class="btn primary" style="${svAns[q.k]?'':'opacity:.4;pointer-events:none'}" onclick="svNext()">${svStep===SURVEY_Q.length-1?'Ver ajustes del plan':'Continuar'}</button></div>`;
  } else {
    const items=computeAdapt();
    el.innerHTML=`<div class="sq-num" style="color:var(--green)">Plan adaptado</div>
      <h2>Ajustamos tu plan</h2>
      <p class="sub" style="color:rgba(255,255,255,.6);margin-top:8px">Form actualizó la próxima sesión según tu registro de hoy.</p>
      <div style="margin-top:18px">${items.map(i=>`<div class="adapt-item">${ICON.check.replace('width="14" height="14"','width="18" height="18"')}<div><b>${i.t}</b><span>${i.s}</span></div></div>`).join('')}</div>
      <div class="foot"><button class="btn primary" onclick="finishSurvey()">Continuar</button></div>`;
  }
}
function svPick(k,v){ svAns[k]=v; renderSurvey(); }
function svNext(){ svStep++; renderSurvey(); }
function computeAdapt(){
  const a=[];
  if(svAns.dolor==='Sí, dolor'){ a.push({t:'Sesión de recuperación agregada',s:'Bajamos el volumen de hombro esta semana'}); }
  if(svAns.quiero==='Avanzar'&&svAns.series==='Todas'&&svAns.dif!=='Muy difícil'){
    a.push({t:'Avanzás a la próxima progresión',s:'Chest-to-wall → kick-up asistido'});
    a.push({t:'Objetivo de aguante +5s',s:'De 20s a 25s en el control de pared'});
  } else if(svAns.dif==='Muy difícil'||svAns.series==='No pude'||svAns.quiero==='Reducir dificultad'){
    a.push({t:'Repetimos la progresión actual',s:'Consolidás antes de avanzar'});
    a.push({t:'Descanso +15s entre series',s:'Más recuperación para mantener la técnica'});
    if(svAns.series==='No pude') a.push({t:'−1 repetición por serie',s:'Ajuste de volumen para completar todo'});
  } else {
    a.push({t:'Mantenemos la progresión',s:'Vas en buen camino: +1 rep la próxima'});
    if(svAns.tec!=='Sólida') a.push({t:'Foco en técnica',s:'Sumamos 1 serie de práctica lenta'});
  }
  if(!a.length) a.push({t:'Plan sin cambios',s:'Seguí con la sesión 4 de 4 el viernes'});
  return a;
}
function finishSurvey(){
  document.getElementById('survey').classList.remove('show');
  if(svAns.quiero==='Avanzar'&&svAns.series==='Todas'&&svAns.dif!=='Muy difícil'){
    document.getElementById('celebrate').classList.add('show');
  } else { quitSession(); }
}

/* ==================== CREATE PLAN WIZARD ==================== */
let cpStep=0; const cpAns={obj:['handstand10'],weeks:'8',days:['Lun','Mié','Vie'],dur:'35',focus:'equilibrado'};
const CP_OBJ=[
  {v:'pullup1',t:'Conseguir la primera pull-up'},
  {v:'handstand10',t:'Handstand de 10 segundos'},
  {v:'muscleup',t:'Aprender el muscle-up'},
  {v:'pushups',t:'Aumentar las push-ups'},
  {v:'lsit',t:'Desbloquear el L-sit'},
  {v:'fuerza',t:'Fuerza general de calistenia'},
];
const CP_STEPS=[
  {type:'obj'},{type:'weeks'},{type:'days'},{type:'dur'},{type:'focus'},{type:'ready'}
];
function startCreatePlan(){ cpStep=0; go('crearplan'); }
function renderCrearPlan(){
  const el=document.getElementById('crearplan');
  const s=CP_STEPS[cpStep]; let body='',title='',num=`Paso ${cpStep+1} de ${CP_STEPS.length}`,sub='';
  if(s.type==='obj'){
    title='¿Qué querés lograr?'; sub='Elegí uno o más objetivos. Form los combina sin sobrecargar los mismos músculos.';
    body=`<div class="opt-grid">${CP_OBJ.map(o=>{const on=cpAns.obj.includes(o.v);return `<button class="opt ${on?'sel':''}" onclick="cpMulti('obj','${o.v}')"><div class="ot"><b>${o.t}</b></div><div class="chk">${ICON.check}</div></button>`;}).join('')}</div>`;
  } else if(s.type==='weeks'){
    title='¿Cuántas semanas?'; sub='Podés extender o acortar el plan cuando quieras.';
    body=`<div class="dur-grid">${[['4','semanas'],['8','semanas'],['12','semanas'],['custom','a medida']].map(w=>`<button class="dur ${cpAns.weeks===w[0]?'sel':''}" onclick="cpSet('weeks','${w[0]}')"><div class="big">${w[0]==='custom'?'∿':w[0]}</div><div class="sm">${w[1]}</div></button>`).join('')}</div>`;
  } else if(s.type==='days'){
    title='¿Qué días entrenás?'; sub='Los demás días quedan como descanso o recuperación.';
    body=`<div style="display:flex;gap:8px;flex-wrap:wrap">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<button class="chip ${cpAns.days.includes(d)?'on':''}" onclick="cpMulti('days','${d}')" style="height:46px;padding:0 20px;font-size:14px">${d}</button>`).join('')}</div>`;
  } else if(s.type==='dur'){
    title='¿Cuánto dura cada sesión?'; sub='';
    body=`<div class="opt-grid two">${[['20','Express'],['35','Equilibrado'],['50','Completo'],['70','Sin apuro']].map(o=>`<button class="opt ${cpAns.dur===o[0]?'sel':''}" onclick="cpSet('dur','${o[0]}')"><div class="ot"><b>${o[0]} min</b><span>${o[1]}</span></div><div class="chk">${ICON.check}</div></button>`).join('')}</div>`;
  } else if(s.type==='focus'){
    title='¿Qué priorizás?'; sub='Ajusta el balance de cada sesión.';
    body=`<div class="opt-grid">${[['fuerza','Fuerza','Más volumen de fuerza'],['tecnica','Técnica','Más práctica de la habilidad'],['movilidad','Movilidad','Prevención y rango'],['equilibrado','Equilibrado','Mezcla recomendada']].map(o=>`<button class="opt ${cpAns.focus===o[0]?'sel':''}" onclick="cpSet('focus','${o[0]}')"><div class="ot"><b>${o[1]}</b><span>${o[2]}</span></div><div class="chk">${ICON.check}</div></button>`).join('')}</div>`;
  } else if(s.type==='ready'){
    const objName=(CP_OBJ.find(o=>o.v===cpAns.obj[0])||CP_OBJ[1]).t;
    el.innerHTML=`<div class="ob-scroll rise" style="justify-content:center">
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center">
        <div style="width:90px;height:90px;border-radius:26px;background:var(--red);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px var(--red-tint);color:#fff;margin-bottom:24px">${ICON.check.replace('width="14" height="14"','width="38" height="38"')}</div>
        <div class="q-num">Plan generado</div>
        <h1 style="margin-top:12px;font-size:26px">Tu plan está listo</h1>
        <p class="sub" style="margin-top:12px;max-width:290px">Plan de <b style="color:var(--ink)">${cpAns.weeks==='custom'?'8':cpAns.weeks} semanas</b> para <b style="color:var(--ink)">${objName}</b>, ${cpAns.days.length} días por semana, sesiones de ${cpAns.dur} min con enfoque ${cpAns.focus}.</p>
        <div class="card" style="margin-top:22px;padding:16px;width:100%;text-align:left">
          <div class="row between"><span class="dim" style="font-size:13px">Semana 1</span><b style="font-size:13px">Evaluación y adaptación</b></div>
          <div class="row between" style="margin-top:9px"><span class="dim" style="font-size:13px">Primer hito</span><b style="font-size:13px">Test de nivel inicial</b></div>
          <div class="row between" style="margin-top:9px"><span class="dim" style="font-size:13px">Sesiones/semana</span><b class="mono" style="font-size:13px">${cpAns.days.length}</b></div>
        </div>
      </div></div>
    <div class="ob-foot"><button class="btn primary" onclick="showToast('Plan activado');openPlan('mes')">Activar plan</button></div>`;
    return;
  }
  const canNext = s.type==='obj'?cpAns.obj.length>0:s.type==='days'?cpAns.days.length>0:true;
  el.innerHTML=`<div class="ob-scroll">
    <div class="q-head rise"><div class="q-num">${num}</div><div class="q-title">${title}</div>${sub?`<p class="sub" style="margin-top:8px">${sub}</p>`:''}</div>
    <div class="rise" style="animation-delay:.05s">${body}</div>
  </div>
  <div class="ob-foot">
    <button class="btn ghost back" onclick="cpPrev()">${ICON.arrow}</button>
    <button class="btn primary" onclick="cpNext()" style="${canNext?'':'opacity:.4;pointer-events:none'}">Continuar</button>
  </div>`;
}
function cpSet(k,v){ cpAns[k]=v; renderCrearPlan(); }
function cpMulti(k,v){ const i=cpAns[k].indexOf(v); i>=0?cpAns[k].splice(i,1):cpAns[k].push(v); renderCrearPlan(); }
function cpNext(){ if(cpStep<CP_STEPS.length-1){cpStep++;renderCrearPlan();} }
function cpPrev(){ if(cpStep>0){cpStep--;renderCrearPlan();} else go('plan'); }

/* ==================== FINAL EVALUATION ==================== */

    ${[['Nivel de Handstand','Nivel 1','Nivel 3','+2'],['Aguante en pared','8s','24s','+16s'],['Pike push-up','5 reps','9 reps','+4'],['Hollow hold','20s','40s','+20s']].map(c=>`

    <div class="stat-grid" style="margin-top:18px">

      <div class="stat-tile"><div class="k">Sesiones completadas</div><div class="v">14<small>/16</small></div></div>
      <div class="stat-tile"><div class="k">Constancia</div><div class="v">88<small>%</small></div></div>
      <div class="stat-tile"><div class="k">Tiempo entrenado</div><div class="v">8.2<small>h</small></div></div>
    </div>

    <div class="card" style="padding:16px;margin-top:14px">
      <div class="row" style="gap:9px;margin-bottom:10px"><span class="pill green">Fortaleza</span><span style="font-size:13.5px;font-weight:600">Fuerza de empuje y constancia</span></div>
      <div class="row" style="gap:9px"><span class="pill gray">A mejorar</span><span style="font-size:13.5px;font-weight:600">Movilidad de hombro y equilibrio</span></div>
    </div>

    <div class="eyebrow" style="margin:24px 4px 12px">¿Qué sigue?</div>
    <div class="reco hi" onclick="startCreatePlan()"><div class="ic">${ICON.bolt}</div><div class="tx"><b>Continuar con un nivel superior</b><span>Handstand libre · 8 semanas</span></div>${chev()}</div>
    <div class="reco" onclick="startCreatePlan()"><div class="ic">${ICON.pull}</div><div class="tx"><b>Combinar dos objetivos</b><span>Handstand + primer muscle-up</span></div>${chev()}</div>
    <div class="reco" onclick="startCreatePlan()"><div class="ic">${ICON.balance}</div><div class="tx"><b>Comenzar una nueva habilidad</b><span>Explorá la biblioteca</span></div>${chev()}</div>
    <div class="reco" onclick="showToast('Semanas 3–4 reprogramadas')"><div class="ic">${ICON.arrow.replace('M15 6l-6 6 6 6','M4 12a8 8 0 108-8 8 8 0 00-6 2.7M4 4v3.7h3.7')}</div><div class="tx"><b>Repetir algunas semanas</b><span>Consolidá antes de avanzar</span></div>${chev()}</div>
    <div style="height:8px"></div>
  </div>`;
}
function chev(){return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" style="flex:none"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}

/* Expose handlers globally so inline onclick works even when the host runs
   this script in an isolated/module scope (e.g. embedded/hosted contexts). */
Object.assign(window,{addRest,closeSheet,cnt,completeSet,cpMulti,cpNext,cpPrev,cpSet,
  finishOnboarding,finishSurvey,go,nextStep,obNext,obPrev,openPlan,openPlanMenu,openSkill,
  pick,planAction,quitSession,setFilter,setPlanView,showToast,skipRest,startCreatePlan,

renderOnboarding();
